name: build

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "patches/**"
      - "CODEMAN_COMMIT"
      - ".forgejo/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Codeman commit
        id: pin
        run: echo "sha=$(cat CODEMAN_COMMIT | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Compute version (CalVer YYYY.MM.DD-<run>)
        id: ver
        # Suffix is the monotonic run number, never a sha: short shas order
        # randomly, so Renovate cannot compare two builds from the same day.
        run: |
          DATE="$(date +%Y.%m.%d)"
          RUN="$(printf '%04d' "${{ github.run_number }}")"
          echo "date=${DATE}"            >> "$GITHUB_OUTPUT"
          echo "version=${DATE}-${RUN}"  >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: git.schuetze.io
          username: marc
          password: ${{ secrets.REGISTRY_PUSH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            CODEMAN_COMMIT=${{ steps.pin.outputs.sha }}
          tags: |
            git.schuetze.io/marc/codeman-superclaude:latest
            git.schuetze.io/marc/codeman-superclaude:${{ steps.ver.outputs.date }}
            git.schuetze.io/marc/codeman-superclaude:${{ steps.ver.outputs.version }}
          # Both shas move from the tag list into labels. A tag has to be
          # orderable; provenance does not.
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.schuetze.codeman.commit=${{ steps.pin.outputs.sha }}
          cache-from: type=registry,ref=git.schuetze.io/marc/codeman-superclaude:buildcache
          cache-to: type=registry,ref=git.schuetze.io/marc/codeman-superclaude:buildcache,mode=max
